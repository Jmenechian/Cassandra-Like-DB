
  ${NODE_NAME}:
    container_name: ${NODE_NAME}
    image: rust:latest
    #platform: linux/amd64
    networks:
      network_net:
        ipv4_address: ${IP_ADDRESS}
    ports:
      - "${NODE_NUMBER}:8000"
    stdin_open: true
    tty: true
    volumes:
      - /Users/agustinbenito/Desktop/Taller-tpGrupal/24C2-Ferris:/app  # Directorio compartido 
      - /tmp/.X11-unix:/tmp/.X11-unix:ro 
    environment:
      DISPLAY: host.docker.internal:0
      LIBGL_ALWAYS_SOFTWARE: "1"
      XAUTHORITY: /tmp/.Xauthority
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y \
                      iputils-ping  \
                      libglvnd0 \
                      libglvnd-dev \
                      libgl1-mesa-glx \
                      libgl1-mesa-dri \
                      libglu1-mesa \
                      mesa-utils \
                      libx11-dev \
                      x11-apps \
                      libxkbcommon-x11-0 && \
                      rustup target add x86_64-apple-darwin && tail -f /dev/null"  # Instalar ping y mantener el contenedor activo
