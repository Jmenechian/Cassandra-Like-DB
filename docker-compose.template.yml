
  ${NODE_NAME}:
    container_name: ${NODE_NAME}
    image: rust:1.81
    networks:
      network_net:
        ipv4_address: ${IP_ADDRESS}
    ports:
      - "${NODE_NUMBER}:8000"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - ./data_${NODE_NUMBER}/tables:/app/src/tables
      - ./data_${NODE_NUMBER}/hinted_handoff:/app/src/tables/logs
      - ./data_${NODE_NUMBER}/logger:/app/src/loggerstuff/logs
    working_dir: /app
    command: ${COMMAND}
