version: '3.8'
services:

  node2:
    container_name: node2
    image: rust:latest
    #platform: linux/amd64
    networks:
      network_net:
        ipv4_address: 10.0.0.2
    ports:
      - "8002:8000"
    stdin_open: true
    tty: true
    volumes:
      - /Users/agustinbenito/Desktop/Taller-tpGrupal/24C2-Ferris:/app  # Directorio compartido 
      - /tmp/.X11-unix:/tmp/.X11-unix:ro 
    environment:
      DISPLAY: host.docker.internal:0
      LIBGL_ALWAYS_SOFTWARE: "1"
      XAUTHORITY: /tmp/.Xauthority
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y                    iputils-ping libglvnd0 libglvnd-dev libgl1-mesa-glx                    libgl1-mesa-dri libglu1-mesa mesa-utils libx11-dev                    x11-apps libxkbcommon-x11-0 &&                    rustup target add x86_64-apple-darwin &&                    cargo run --bin server 10.0.0.2"
