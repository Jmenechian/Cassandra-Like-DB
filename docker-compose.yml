version: '3.8'
services:

  node2:
    container_name: node2
    image: rust:1.81
    networks:
      network_net:
        ipv4_address: 10.0.0.2
    ports:
      - "8002:8000"
    volumes:
      - .:/app
      - ./data_8002/tables:/app/src/tables
      - ./data_8002/logger:/app/src/loggerstuff/logs
      - ./data_8002/hinted_handoff:/app/src/tables/logs
      - ./target:/app/target
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.2"
          

