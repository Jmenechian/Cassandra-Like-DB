version: '3.8'
services:
  builder:
    container_name: builder
    build:
      context: .
      dockerfile: Dockerfile
    image: my_build_image
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /target/release/server"]  # Check if the binary is created
      interval: 10s
      timeout: 15s
      retries: 5
    command: bash -c "cargo build --release && sleep infinity" 

  node2:
    container_name: node2
    image: my_build_image
    networks:
      network_net:
        ipv4_address: 10.0.0.2
    ports:
      - "8002:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.2"
          
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8002"] # Check if TCP port 8002 is open
      interval: 10s
      timeout: 15s
      retries: 100
    depends_on:
      builder:
        condition: service_healthy

  node3:
    container_name: node3
    image: my_build_image
    networks:
      network_net:
        ipv4_address: 10.0.0.3
    ports:
      - "8003:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.3"
          
    depends_on:
      node2:
        condition: service_healthy
      builder:
        condition: service_healthy

  node4:
    container_name: node4
    image: my_build_image
    networks:
      network_net:
        ipv4_address: 10.0.0.4
    ports:
      - "8004:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.4"
          
    depends_on:
      node2:
        condition: service_healthy
      builder:
        condition: service_healthy

  node5:
    container_name: node5
    image: my_build_image
    networks:
      network_net:
        ipv4_address: 10.0.0.5
    ports:
      - "8005:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.5"
          
    depends_on:
      node2:
        condition: service_healthy
      builder:
        condition: service_healthy
networks:
  network_net:
    external: true
