version: '3.8'
services:

  node2:
    container_name: node2
    build:
      context: .
      dockerfile: dockerfile
    networks:
      network_net:
        ipv4_address: 10.0.0.2
    ports:
      - "8002:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.2"
          
  node3:
    container_name: node3
    build:
      context: .
      dockerfile: dockerfile
    networks:
      network_net:
        ipv4_address: 10.0.0.3
    ports:
      - "8003:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.3"
          
  node4:
    container_name: node4
    build:
      context: .
      dockerfile: dockerfile
    networks:
      network_net:
        ipv4_address: 10.0.0.4
    ports:
      - "8004:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.4"
          
  node5:
    container_name: node5
    build:
      context: .
      dockerfile: dockerfile
    networks:
      network_net:
        ipv4_address: 10.0.0.5
    ports:
      - "8005:8000"
    command: bash -c "apt-get update && apt-get install -y           iputils-ping &&           cargo run --bin server 10.0.0.5"
          
networks:
  network_net:
    external: true
