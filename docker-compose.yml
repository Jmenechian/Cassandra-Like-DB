version: '3.8'
services:

  node2:
    container_name: node2
    image: rust:latest
    platform: linux/amd64
    networks:
      network_net:
        ipv4_address: 10.0.0.2
    ports:
      - "8002:8000"
    stdin_open: true
    tty: true
    volumes:
      - .:/app  # Directorio compartido 
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y                    iputils-ping &&                   cargo run --bin server 10.0.0.2"
